<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>마이크로비트·아두이노 실습실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="마이크로비트와 아두이노 실습실을 나눠, 기본 레슨과 빈칸을 고쳐 테스트를 통과하는 프로젝트 미션을 하는 피지컬 컴퓨팅 시뮬레이터">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 왼쪽 레슨 목록 · 가운데 실험대(보드를 직접 만지는 곳) · 오른쪽 코드 노트(코드·핵심·확인 학습). 한 화면에서 ‘만지기 → 코드 읽기 → 확인’이 끝나요. */
:root{
  --bg:#e6edeb; --paper:#f8fbfa; --sunk:#eef3f1; --ink:#13262a; --muted:#566b6e; --line:rgba(19,38,42,.12);
  --accent:#0b8a86; --accent-ink:#ffffff; --accent-soft:rgba(11,138,134,.13);
  --ok:#2b8a4e; --bad:#c13b3b; --warn:#a8740a;
  --once:#3c6bd0; --loop:#0b8a86; --event:#8b56c6; --decl:#8b989a;
  --code-bg:#f1f5f4; --kw:#8a3fbf; --fn:#1f5fbf; --num:#b0560d; --str:#2b7a3d; --com:#7a8c8d; --cst:#b2306a;
  --wire:#2a4049; --shadow:0 10px 30px -12px rgba(19,50,60,.35);
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Malgun Gothic",monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1719; --paper:#142226; --sunk:#1a2a2e; --ink:#e2eeec; --muted:#93a8a8; --line:rgba(226,238,236,.12);
  --accent:#2fc2b8; --accent-ink:#06211f; --accent-soft:rgba(47,194,184,.16);
  --ok:#4cc27a; --bad:#ef6a6a; --warn:#e6b142;
  --once:#7aa2ff; --loop:#2fc2b8; --event:#c39af0; --decl:#7d8f91;
  --code-bg:#0f1b1e; --kw:#c792ea; --fn:#82aaff; --num:#f5a35b; --str:#a5d68e; --com:#6f8586; --cst:#ff8fb8;
  --wire:#b9cfd2; --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1719; --paper:#142226; --sunk:#1a2a2e; --ink:#e2eeec; --muted:#93a8a8; --line:rgba(226,238,236,.12);
  --accent:#2fc2b8; --accent-ink:#06211f; --accent-soft:rgba(47,194,184,.16);
  --ok:#4cc27a; --bad:#ef6a6a; --warn:#e6b142;
  --once:#7aa2ff; --loop:#2fc2b8; --event:#c39af0; --decl:#7d8f91;
  --code-bg:#0f1b1e; --kw:#c792ea; --fn:#82aaff; --num:#f5a35b; --str:#a5d68e; --com:#6f8586; --cst:#ff8fb8;
  --wire:#b9cfd2; --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);overflow:hidden;
  word-break:keep-all;line-break:strict;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* 위 띠 */
.top{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font:400 clamp(22px,2.4vw,30px)/1 var(--display);letter-spacing:-.01em}
.brand small{font:500 11.5px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.top .sp{flex:1}
.score{font:600 12px var(--mono);letter-spacing:.04em;padding:8px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.score b{color:var(--accent)}
.ib-top{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:600}
.ib-top[aria-pressed="false"]{color:var(--muted)}
.ib-top[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* 본문 3단 */
.main{display:grid;grid-template-columns:212px minmax(0,1fr) minmax(360px,min(38vw,500px));gap:12px;min-height:0;
  padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0;padding-right:2px}
.rail h3{margin:6px 4px 4px;font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.rail h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.rail .grp{display:flex;flex-direction:column;gap:4px}
.ls{display:grid;grid-template-columns:30px 1fr;gap:2px 8px;align-items:center;text-align:left;padding:9px 10px;border-radius:12px;border:1px solid transparent;background:transparent;min-height:48px}
.ls:hover{background:var(--paper)}
.ls .no{grid-row:span 2;font:600 12px var(--mono);color:var(--muted);text-align:center;border-radius:8px;padding:5px 0;background:var(--sunk)}
.ls .nm{font-weight:600;font-size:14px;line-height:1.3}
.ls .tm{font:500 11px var(--mono);color:var(--muted);letter-spacing:.02em}
.ls[aria-current="true"]{background:var(--paper);border-color:var(--line);box-shadow:var(--shadow)}
.ls[aria-current="true"] .no{background:var(--accent);color:var(--accent-ink)}
.ls .done{color:var(--ok);font-size:11px;margin-left:4px}

/* 가운데 실험대 */
.stage{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.lhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 14px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.lhead .crumb{width:100%;font:600 11.5px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.lhead h2{margin:0;font:400 clamp(22px,2.3vw,30px)/1.05 var(--display);text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 11.5px var(--mono);padding:3px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);letter-spacing:.02em}
.lhead .goal{width:100%;margin:2px 0 0;color:var(--muted);font-size:14px;text-wrap:pretty}
.sim{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.sim > svg{flex:1;min-height:0;width:100%;height:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--sunk)}
.cb{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:14px;font-weight:600;white-space:nowrap;user-select:none;-webkit-user-select:none}
.cb:hover{border-color:var(--accent)}
.cb[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cb.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cb.hold.on{background:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border-radius:13px;border:1px solid var(--line);background:var(--paper);padding:2px;gap:2px}
.seg .cb{border:0;min-height:40px;border-radius:10px;padding:0 12px}
.ctrl .info{font:500 12px var(--mono);color:var(--muted);letter-spacing:.03em;font-variant-numeric:tabular-nums;margin-left:auto}
.sl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 12px;min-height:44px}
.sl input{width:clamp(90px,12vw,170px);accent-color:var(--accent)}
.sl output{font:600 12px var(--mono);min-width:64px;font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:2px 4px 2px 10px;font-size:13px;font-weight:600}
.stepper .cb{min-height:40px;min-width:40px;padding:0;border:0;background:var(--sunk)}
.stepper output{font:600 13px var(--mono);min-width:28px;text-align:center}

/* 시리얼 모니터 띠 */
.serial{margin:0 14px 10px;border-radius:12px;background:var(--code-bg);border:1px solid var(--line);font:500 12px/1.45 var(--mono);overflow:hidden}
.serial-h{display:flex;justify-content:space-between;padding:4px 10px;color:var(--muted);font-size:11px;letter-spacing:.06em;border-bottom:1px solid var(--line)}
.serial-b{padding:4px 10px;height:66px;overflow:hidden;font-variant-numeric:tabular-nums}

/* SVG 공통 */
.t{font:500 12px var(--mono);fill:var(--ink)}
.tm{fill:var(--muted)}
.tb{font:600 15px var(--body);fill:var(--ink)}
.tbig{font:400 40px var(--display);fill:var(--ink)}
.tacc{fill:var(--accent)}
.tw{font:600 9.5px var(--mono);fill:#e8f1f1}
.mb-lab{font:700 13px var(--body);fill:#e8edef;text-anchor:middle}
.wire{fill:none;stroke:var(--wire);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wire.thin{stroke-width:1.4;opacity:.6}
.dot{fill:var(--wire)}
.flow .wire{stroke:var(--accent);stroke-dasharray:7 6;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
.hit{fill:transparent;cursor:pointer}
.mb-btn{cursor:pointer}
.mb-btn.pressed circle{fill:#0b8a86}
.co-line{stroke:var(--ink);stroke-width:1.2;opacity:.55;fill:none}
.co-dot{fill:var(--accent);stroke:var(--paper);stroke-width:2}
.co-t{font:600 13px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.panelbox{fill:var(--sunk);stroke:var(--line)}
.grid-l{stroke:var(--line);stroke-width:1}
.th-line{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:6 5}
.th2-line{stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 4}
.plot{fill:none;stroke:var(--ink);stroke-width:2}
.bar-bg{fill:var(--line)}
.bar-fg{fill:var(--accent)}
.cell0{fill:var(--line)} .cell1{fill:var(--accent)}
.tt-on{fill:var(--accent-soft)}

/* 오른쪽 코드 노트 */
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.tabs{display:flex;gap:4px;padding:10px 10px 0;border-bottom:1px solid var(--line)}
.tab{flex:1;min-height:44px;border:0;background:transparent;border-radius:12px 12px 0 0;font-weight:600;font-size:14px;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pbody{flex:1;overflow:auto;min-height:0;padding:12px 14px 18px;scroll-behavior:smooth}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.k-decl{--k:var(--decl)} .k-once{--k:var(--once)} .k-loop{--k:var(--loop)} .k-event{--k:var(--event)}
.legend i,.rail h3 i{background:var(--k)}
.codebar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.codebar .lang{font:600 11.5px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.codebar .sp{flex:1}
.mini{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:600}
.code{background:var(--code-bg);border-radius:14px;border:1px solid var(--line);padding:8px 0;font:500 13px/1.6 var(--mono);overflow-x:auto}
.ln{display:grid;grid-template-columns:34px 1fr 30px;align-items:start;border-left:4px solid var(--k,transparent);min-width:max-content;transition:background .25s var(--ease)}
.ln .no{color:var(--muted);text-align:right;padding-right:10px;opacity:.7;user-select:none;font-variant-numeric:tabular-nums}
.ln .tx{white-space:pre;padding-right:8px}
.ln .star{border:0;background:transparent;color:var(--warn);font-size:14px;line-height:1.6;padding:0;min-height:0;width:28px}
.ln.on{background:var(--accent-soft)}
.ln.on .no{color:var(--accent);opacity:1;font-weight:700}
.note{margin:4px 10px 8px 38px;padding:10px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font:400 13.5px/1.6 var(--body);white-space:normal;max-width:56ch}
.note b{display:block;margin-bottom:2px}
.c-com{color:var(--com)} .c-str{color:var(--str)} .c-kw{color:var(--kw);font-weight:600} .c-num{color:var(--num)} .c-fn{color:var(--fn)} .c-cst{color:var(--cst);font-weight:600}
.tip{margin-top:10px;font-size:13px;color:var(--muted)}

.card{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--paper);margin-bottom:10px}
.card h4{margin:0 0 4px;font-size:15px}
.card p{margin:0;font-size:14px;color:var(--ink);text-wrap:pretty}
.card .mut{color:var(--muted)}
.struct{display:grid;gap:8px;margin-bottom:12px}
.srow{display:grid;grid-template-columns:6px 1fr;gap:10px;align-items:stretch}
.srow > i{border-radius:3px;background:var(--k)}
.srow b{font-size:14px}
.srow span{font:500 12px var(--mono);color:var(--muted);margin-left:6px}
.srow p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.keyc{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.keyc .lnb{font:600 12px var(--mono);border-radius:8px;padding:4px 8px;border:1px solid var(--line);background:var(--sunk);min-height:32px}
.h-sec{font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}

.q{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.q .qn{font:600 11.5px var(--mono);color:var(--muted);letter-spacing:.06em}
.q p{margin:2px 0 8px;font-weight:600;font-size:14.5px;text-wrap:pretty}
.opts{display:grid;gap:6px}
.opt{text-align:left;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:14px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.why{margin-top:8px;font-size:13.5px;padding:8px 10px;border-radius:10px;background:var(--sunk)}
.why b.okc{color:var(--ok)} .why b.badc{color:var(--bad)}
.task{border:1.5px solid var(--accent);border-radius:16px;padding:12px 14px;background:var(--accent-soft)}
.task .qn{color:var(--accent)}
.task .hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.task pre{margin:8px 0 0}
.credit{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(2px + env(safe-area-inset-bottom,0px));font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.04em;opacity:.8;pointer-events:none}

/* IDE 흉내 화면 */
.sim{container-type:inline-size}
.idew{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:10px;padding:12px 14px}
@container (max-width:640px){.idew{grid-template-columns:minmax(0,1fr) 168px}.mi small{display:none}.mi{padding:6px;font-size:12.5px}.libp{width:170px}}
.ide{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);font-size:13px;position:relative}
.ide-menu{display:flex;gap:2px;padding:2px 6px;background:var(--sunk);border-bottom:1px solid var(--line);position:relative}
.ide-menu button,.ide-menu span{border:0;background:transparent;padding:6px 8px;font-size:12.5px;border-radius:6px;color:var(--ink)}
.ide-menu span{color:var(--muted)}
.ide-menu button.hl{outline:2px dashed var(--accent);outline-offset:-2px}
.ide-bar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);position:relative}
.ibt{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;padding:0}
.ibt svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibt.hl,.bsel.hl,.sideb.hl{box-shadow:0 0 0 3px var(--accent)}
.ibt.dis{opacity:.4;cursor:default}
.bsel{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--paper);padding:0 10px;font-size:12.5px;display:flex;align-items:center;gap:6px;max-width:220px;overflow:hidden;white-space:nowrap}
.dd{position:absolute;z-index:5;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:220px}
.dd button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;font-size:13px}
.dd button:hover{background:var(--accent-soft)}
.dd .dim{color:var(--muted);padding:8px 10px;font-size:12.5px}
.ide-body{flex:1;min-height:0;display:flex}
.ide-side{display:flex;flex-direction:column;gap:4px;padding:6px;border-right:1px solid var(--line);background:var(--sunk)}
.sideb{width:36px;height:36px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.sideb svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sideb[aria-pressed="true"]{background:var(--accent-soft)}
.sideb[aria-pressed="true"] svg{stroke:var(--accent)}
.libp{width:230px;border-right:1px solid var(--line);padding:8px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.libp .ttl{font:600 11px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.libp .srch{display:flex;gap:4px;flex-wrap:wrap}
.libp .srch .q-in{flex:1 1 100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:500 12.5px var(--mono);background:var(--sunk);min-height:32px}
.libp .srch button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:12px;min-height:32px}
.libcard{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12.5px}
.libcard b{display:block;font-size:13px}
.libcard .by{color:var(--muted);font-size:11.5px}
.libcard .row{display:flex;align-items:center;gap:6px;margin-top:6px}
.libcard .inst{font:600 11px var(--mono);color:var(--ok)}
.libcard button{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:4px 10px;font-size:12px;min-height:32px}
.ide-ed{flex:1;min-width:0;overflow:auto;font:500 12.5px/1.55 var(--mono);padding:6px 0;background:var(--paper)}
.ide-ed .el{display:grid;grid-template-columns:30px 1fr;white-space:pre}
.ide-ed .el .no{color:var(--muted);text-align:right;padding-right:8px;opacity:.6}

const Snd={ctx:null,sfx:true,bgm:false,pad:null,
  ensure(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();return this.ctx;},
  beep(f,d=.08,type='sine',v=.06,delay=0){if(!this.sfx)return;const c=this.ensure();if(!c)return;const t=c.currentTime+delay;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);},
  click(){this.beep(1400,.04,'triangle',.035);},
  ok(){this.beep(660,.12,'sine',.07);this.beep(990,.18,'sine',.07,.1);},
  bad(){this.beep(220,.2,'square',.035);},
  blip(){this.beep(880,.06,'sine',.04);},
  startPad(){const c=this.ensure();if(!c||this.pad)return;const out=c.createGain();out.gain.value=0;out.connect(c.destination);out.gain.linearRampToValueAtTime(.028,c.currentTime+2);
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.connect(out);
    const chords=[[130.8,196,329.6],[110,164.8,261.6],[146.8,220,349.2],[123.5,185,293.7]];
    const osc=chords[0].map(f=>{const o=c.createOscillator();o.type='sine';o.frequency.value=f;o.connect(lp);o.start();return o;});
    let k=0;const iv=setInterval(()=>{k=(k+1)%chords.length;osc.forEach((o,i)=>o.frequency.linearRampToValueAtTime(chords[k][i],c.currentTime+3));},8000);
    this.pad={out,osc,iv};},
  stopPad(){if(!this.pad||!this.ctx)return;const p=this.pad;this.pad=null;clearInterval(p.iv);p.out.gain.linearRampToValueAtTime(0,this.ctx.currentTime+.8);setTimeout(()=>p.osc.forEach(o=>o.stop()),900);}
};

/* ---------- 마이크로비트 화면 ---------- */
class MBDisp{
  constructor(){this.px=new Array(25).fill(0);this.sc=null;this.bright=255;}
  clear(){this.sc=null;this.px.fill(0);}
  icon(n){this.sc=null;const s=ICON[n];for(let i=0;i<25;i++)this.px[i]=+s[i];}
  glyph(ch){const s=FONT[ch]||FONT[' '];for(let i=0;i<25;i++)this.px[i]=+s[i];}
  plot(x,y){this.sc=null;this.px[y*5+x]=1;}
  unplot(x,y){this.sc=null;this.px[y*5+x]=0;}
  toggle(x,y){this.sc=null;this.px[y*5+x]^=1;}
  static cols(str){const c=[];for(const ch of String(str)){const s=FONT[ch]||FONT[' '];for(let x=0;x<5;x++){const col=[];for(let y=0;y<5;y++)col.push(+s[y*5+x]);c.push(col);}c.push([0,0,0,0,0]);}return c;}
  static dur(str){str=String(str);return str.length===1?400:(MBDisp.cols(str).length+5)*150;}
  text(str){str=String(str);if(str.length===1){this.sc=null;this.glyph(str);return;}this.sc={cols:MBDisp.cols(str),t:0};}
  update(dt){if(!this.sc)return;this.sc.t+=dt;const off=Math.floor(this.sc.t/150)-4;const cols=this.sc.cols;
    if(off>=cols.length){this.sc=null;this.px.fill(0);return;}
    for(let x=0;x<5;x++){const ci=off+x;const col=(ci>=0&&ci<cols.length)?cols[ci]:[0,0,0,0,0];for(let y=0;y<5;y++)this.px[y*5+x]=col[y];}}
  render(rects){if(!rects)return;const b=this.bright/255;for(let i=0;i<rects.length;i++){const on=this.px[i];const r=rects[i];
    const f=on?'#ff3b30':'#3a4046',o=on?(0.22+0.78*b).toFixed(2):'1';if(r._f!==f||r._o!==o){r.setAttribute('fill',f);r.setAttribute('fill-opacity',o);r._f=f;r._o=o;}}}
}

/* ---------- 코드 실행 흐름(진행 순서) ---------- */
class Seq{
  constructor(setup,loop){this.s=setup;this.l=loop;this.ph=0;this.i=-1;this.t=0;this.loops=0;this.next();}
  get list(){return this.ph===0?this.s:this.l;}
  get op(){return this.list[this.i];}
  next(){this.i++;
    if(this.ph===0&&this.i>=this.s.length){this.ph=1;this.i=0;}
    else if(this.ph===1&&this.i>=this.l.length){this.i=0;}
    if(this.ph===1&&this.i===0)this.loops++;
    const op=this.op;op.f&&op.f();}
  dur(op){return op.d!=null?op.d:(S.slow?300:0);}
  tick(dt){this.t+=dt;let g=0;while(this.t>=this.dur(this.op)&&g++<200){this.t-=this.dur(this.op);this.next();}}
  lines(){return this.op.l||[];}
}

/* 구조 보기 (이미지 + 번호 + 설명 카드) */
const SV={
 html(D,extra=''){const im=IMG[D.img];
  return `<div class="sv-wrap ${D.narrow?'narrow':''}"><figure class="sv-fig"><div class="sv-imgbox"><img src="${im}" alt="${D.img==='mb'?'마이크로비트 V2 앞면과 뒷면 구조 포스터':'아두이노 우노 보드 사진'}">
   ${D.items.map((it,i)=>[[it.x,it.y],it.x2?[it.x2,it.y2]:null].filter(Boolean).map(([x,y])=>`<button class="hs ${it.extra?'ex':''} ${it.warn?'fx':''}" data-act="hs" data-i="${i}" style="left:${x}%;top:${y}%" aria-label="${it.t}">${it.n}</button>`).join('')).join('')}
   <span class="glow" id="svGlow" hidden></span></div><figcaption>${D.cap}</figcaption></figure>
   <div class="sv-info"><div class="sv-list">${D.items.map((it,i)=>`<button class="sv-chip ${it.extra?'ex':''} ${it.warn?'fx':''}" data-act="hs" data-i="${i}"><b>${it.n}</b>${it.t.replace(/ \(.*\)/,'')}</button>`).join('')}</div>
   <article class="sv-card" id="svCard" aria-live="polite"></article>${extra}</div></div>`;},
 show(D,i){const it=D.items[i];$$('#sim .hs,#sim .sv-chip').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  const c=$('#svCard');if(!c)return;
  c.innerHTML=`<div class="sv-h"><span class="sv-n">${it.n}</span><div><h4>${it.t}</h4>${it.en?`<small>${it.en}</small>`:''}</div>${it.v2?'<span class="badge">V2 전용</span>':''}${it.extra?'<span class="badge">보충</span>':''}</div>
   <p>${it.b}</p>${it.code?`<code class="sv-code">${esc(it.code)}</code>`:''}
   ${it.fix?`<div class="fix"><b>${it.warn?'교재 표기 바로잡기':'헷갈리기 쉬운 점'}</b>${it.fix}</div>`:''}
   ${it.term?`<p class="sv-more">용어 정리: ${termBtn(it.term)}</p>`:''}`;}
};

 $('#dlgBody').innerHTML=`<span class="qn">용어 정리</span><h3>${g.t}</h3><p>${g.b}</p>
  <div class="dlg-act">${g.go?`<button class="cb go" data-goto="${g.go}">관련 이론 학습 열기</button>`:''}<button class="cb" data-goto="gl-${S.board}#${k}">용어 사전에서 보기</button></div>`;
 d.hidden=false;$('#dlgClose').focus();}
function closeTerm(){$('#dlg').hidden=true;}

const DOC_RES=board=>{const ar=board==='ar';return {
 id:'res-'+board,board,doc:true,no:'R',title:'아날로그 · PWM과 분해능',term:['ADC','분해능','PWM'],
 goal:ar?'analogRead는 10비트(1024단계), analogWrite는 8비트(256단계)예요. 단계 수가 왜 중요한지 슬라이더로 확인해요.':'마이크로비트는 아날로그 입력과 출력이 모두 0~1023(10비트)이에요. 단계 수가 왜 중요한지 슬라이더로 확인해요.',
 V:ar?5:3.3,
 mount(){this.st={v:ar?2.5:1.65,bits:10,pw:ar?128:512};this.draw();$('#ctrl').innerHTML='';},
 draw(){const ar=this.board==='ar',V=this.V;
  $('#sim').innerHTML=`<div class="doc"><section class="dsec"><h3>1. 아날로그 신호를 숫자로 바꾸기: ADC와 분해능</h3>
   <p>센서가 내보내는 전압은 연속으로 바뀌는 ${termBtn('analog','아날로그 신호')}예요. 보드는 이 전압을 ${termBtn('adc','ADC')}로 숫자로 바꿔요. 이때 몇 단계로 나눌 수 있는지가 ${termBtn('res','분해능')}이에요. n비트 ADC는 2<sup>n</sup>단계로 나눠요.</p>
   <div class="kv"><div><b>${ar?'아두이노 우노':'마이크로비트'} 아날로그 입력</b><span>10비트 · 0 ~ 1023 · 1024단계</span></div><div><b>기준 전압</b><span>${V}V</span></div><div><b>한 칸(1 LSB)</b><span>${V}V ÷ 1024 ≈ ${(V/1024*1000).toFixed(2)}mV</span></div><div><b>코드</b><span>${ar?'analogRead(A0)':'pins.analog_read_pin(AnalogPin.P0)'}</span></div></div>
   <div class="ctlrow">${SL('rv','입력 전압',0,V,.01,this.st.v,this.st.v.toFixed(2)+' V')}${SEG('bits',[[2,'2비트'],[4,'4비트'],[8,'8비트'],[10,'10비트']],this.st.bits)}</div>
   <svg viewBox="0 0 720 240" class="dchart" id="adcSvg" role="img" aria-label="비트 수에 따른 계단 모양 변환"></svg>
   <p class="dnote" id="adcT"></p>
   <p class="mut">비트 수가 적을수록 계단이 크고 거칠어서 작은 전압 변화는 같은 숫자로 읽혀요. 그래서 온도 센서 TMP36처럼 1℃가 0.01V(10mV)인 센서를 우노로 읽으면 한 칸(약 4.9mV)이 약 0.5℃가 돼요.</p></section>
   <section class="dsec"><h3>2. 숫자로 아날로그 흉내 내기: PWM과 분해능</h3>
   <p>${ar?'우노에는 진짜 아날로그 전압을 내는 핀이 없어요. 대신 ~ 표시 핀에서':'마이크로비트도 진짜 아날로그 전압 대신 핀에서'} ${termBtn('pwm','PWM')}을 내요. 아주 빠르게 켰다 껐다 하며, 켜진 시간 비율(${termBtn('duty','듀티비')})로 평균 전압을 정해요.</p>
   <div class="kv"><div><b>${ar?'analogWrite(핀, 값)':'pins.analog_write_pin(AnalogPin.P0, 값)'}</b><span>${ar?'8비트 · 0 ~ 255 · 256단계':'10비트 · 0 ~ 1023 · 1024단계'}</span></div><div><b>주파수</b><span>${ar?'약 490Hz (5·6번 핀은 약 980Hz)':'기본 주기 20ms (50Hz), pins.analog_set_period로 변경'}</span></div><div><b>한 단계</b><span>${ar?'듀티 약 0.39% · 평균 약 19.6mV':'듀티 약 0.1% · 평균 약 3.2mV'}</span></div><div><b>쓸 수 있는 핀</b><span>${ar?'~3, ~5, ~6, ~9, ~10, ~11':'P0, P1, P2 등 (동시에 최대 3개)'}</span></div></div>
   <div class="ctlrow">${SL('pv',ar?'analogWrite 값':'analog_write_pin 값',0,ar?255:1023,1,this.st.pw,String(this.st.pw))}</div>
   <svg viewBox="0 0 720 170" class="dchart" id="pwmSvg" role="img" aria-label="PWM 파형과 평균 전압"></svg>
   <p class="dnote" id="pwmT"></p></section>
   ${ar?`<section class="dsec"><h3>3. 왜 map(값, 0, 1023, 0, 255)를 쓸까?</h3><p>입력(analogRead)은 10비트, 출력(analogWrite)은 8비트라서 범위가 달라요. 1023을 그대로 analogWrite에 넣으면 255를 넘어가요. ${termBtn('map','map()')}으로 범위를 맞추면 4단계씩 묶여 하나의 출력값이 돼요(÷4와 거의 같아요).</p>
    <div class="kv"><div><b>analogRead</b><span>0 · 512 · 1023</span></div><div><b>map(…, 0, 1023, 0, 255)</b><span>0 · 127 · 255</span></div></div></section>`:''}
   <section class="dsec"><h3>${ar?'4':'3'}. 이 내용을 쓰는 곳</h3><p class="links">${ar?`${goBtn('a3','야간등 (analogRead)')} ${goBtn('a4','DC 모터 속도 (analogWrite)')} ${goBtn('ax2','실습 M2 온도 3단계')} ${goBtn('ax4','실습 M4 산사태 경보')}`:`${goBtn('mx1','실습 M1 현관등')} ${goBtn('m2','만보기 (가속도 값)')}`}</p></section></div>`;
  this.upd();},
 upd(){const s=this.st,V=this.V,N=Math.pow(2,s.bits),code=Math.min(N-1,Math.floor(s.v/V*N)),W=640,H=180,X0=60,Y0=200;
  let path=`M ${X0} ${Y0}`;for(let k=0;k<N;k++){const x=X0+k/N*W,y=Y0-k/(N-1)*H;path+=` L ${x.toFixed(1)} ${y.toFixed(1)} L ${(X0+(k+1)/N*W).toFixed(1)} ${y.toFixed(1)}`;}
  const mx=X0+s.v/V*W,my=Y0-code/(N-1)*H;
  const a=$('#adcSvg');if(a)a.innerHTML=`<line x1="${X0}" x2="${X0+W}" y1="${Y0}" y2="${Y0}" stroke="var(--muted)"/><line x1="${X0}" x2="${X0}" y1="${Y0}" y2="${Y0-H-6}" stroke="var(--muted)"/>
   <line x1="${X0}" y1="${Y0}" x2="${X0+W}" y2="${Y0-H}" stroke="var(--muted)" stroke-dasharray="4 4"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
   <line x1="${mx}" x2="${mx}" y1="${Y0}" y2="${my}" stroke="var(--ink)" stroke-dasharray="3 3"/><circle cx="${mx}" cy="${my}" r="6" fill="var(--accent)" stroke="var(--paper)" stroke-width="2"/>
   <text class="t tm" x="${X0}" y="${Y0+18}">0V</text><text class="t tm" x="${X0+W}" y="${Y0+18}" text-anchor="end">${V}V</text><text class="t tm" x="${X0-8}" y="${Y0-H+4}" text-anchor="end">${N-1}</text><text class="t tm" x="${X0-8}" y="${Y0+4}" text-anchor="end">0</text>
   <text class="t tacc" x="${X0+8}" y="${Y0-H+4}">${s.bits}비트 = ${N}단계</text>`;
  txt('adcT',`${s.v.toFixed(2)}V → ${s.bits}비트로 읽으면 ${code} (한 칸 ${(V/N*1000).toFixed(1)}mV). 10비트라면 ${Math.min(1023,Math.floor(s.v/V*1024))}.`);
  const ar=this.board==='ar',M=ar?255:1023,d=s.pw/M;let pts='',x=40;for(let k=0;k<4;k++){const on=150*d;pts+=`${x},120 ${x},${d>0?40:120} ${(x+on).toFixed(1)},${d>0?40:120} ${(x+on).toFixed(1)},120 ${x+150},120 `;x+=150;}
  const avgY=120-80*d;const p=$('#pwmSvg');if(p)p.innerHTML=`<line x1="40" x2="640" y1="120" y2="120" stroke="var(--muted)"/><polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2"/>
   <line x1="40" x2="640" y1="${avgY}" y2="${avgY}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/><text class="t tacc" x="646" y="${avgY+4}">평균</text>
   <text class="t tm" x="34" y="44" text-anchor="end">${V}V</text><text class="t tm" x="34" y="124" text-anchor="end">0V</text><text class="t tm" x="40" y="150">한 주기 ×4</text>`;
  txt('pwmT',`값 ${s.pw} / ${M} → 듀티 ${(d*100).toFixed(1)}% → 평균 약 ${(V*d).toFixed(2)}V. LED는 이만큼 밝게, 모터는 이만큼 빠르게 느껴져요.`);},
 act(a,el){const s=this.st;if(a==='rv'){s.v=+el.value;txt('rv-o',s.v.toFixed(2)+' V');this.upd();}
  if(a==='bits'){s.bits=+el.dataset.v;setSegIn('bits',s.bits);this.upd();}
  if(a==='pv'){s.pw=+el.value;txt('pv-o',el.value);this.upd();}}
};};
function setSegIn(act,val){$$(`#sim [data-act="${act}"]`).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(val))));}
function goBtn(id,label){return `<button class="gl" data-goto="${id}">${label}</button>`;}

const DOC_SENS=board=>({id:'sens-'+board,board,doc:true,no:'S',title:'센서 자료실',term:['센서','입력','감각'],
 goal:board==='mb'?'마이크로비트에 들어 있는 센서와 확장 센서 15종을 골라 보며 역할, 핀, 원리를 익혀요.':'아두이노에 연결하는 센서 15종과 실습에 쓰는 센서를 골라 보며 역할, 핀, 원리를 익혀요.',
 mount(){this.st={sel:this.st&&this.st.sel||(board==='mb'?'mb-light':'s13'),f:'all'};this.draw();$('#ctrl').innerHTML='';},
 focus(a){if(a){this.st.sel=a;this.draw();}},
 list(){const L=[];if(board==='mb')MB_SENSORS.forEach(s=>L.push({...s,mb:1}));SENSORS.forEach(s=>L.push(s));return L;},
 draw(){const L=this.list(),f=this.st.f,sel=L.find(s=>s.id===this.st.sel)||L[0];
  const show=s=>f==='all'||(f==='mb'&&s.mb)||(f==='an'&&!s.mb&&/아날로그/.test(s.out))||(f==='dg'&&!s.mb&&/디지털/.test(s.out))||(f==='i2c'&&!s.mb&&/I²C|SPI|UART|MIPI/.test(s.out))||(f==='mis'&&s.mission);
  $('#sim').innerHTML=`<div class="sens"><div class="sens-l"><div class="seg sfil" role="group">${[['all','전체'],...(board==='mb'?[['mb','내장']]:[]),['an','아날로그'],['dg','디지털'],['i2c','통신'],['mis','실습용']].map(([v,l])=>`<button class="cb" data-act="sf" data-v="${v}" aria-pressed="${f===v}">${l}</button>`).join('')}</div>
   <div class="sens-list">${L.filter(show).map(s=>`<button class="sens-it" data-act="sen" data-v="${s.id}" aria-current="${s.id===sel.id}">${IMG[s.p||s.id]?`<img src="${IMG[s.p||s.id]}" alt="">`:`<span class="sens-ph">${s.mb?'mb':'IC'}</span>`}<span><b>${s.nm}</b><small>${s.sense} · ${s.mb?'내장':s.out}</small></span></button>`).join('')}</div></div>
   <article class="sens-d">${this.detail(sel)}</article></div>`;},
 detail(s){if(s.mb)return `<div class="sd-h"><img src="${IMG[s.id]}" alt="${s.nm} 위치"><div><span class="qn">마이크로비트 내장 센서</span><h3>${s.nm}</h3><p class="mut">${s.sense} · 값 범위 ${s.range}</p></div></div><code class="sv-code">${esc(s.code)}</code><p>${s.b}</p>${s.mission?`<p class="links">${goBtn(s.mission,'이 센서를 쓰는 실습 열기')}</p>`:''}<p class="links">${goBtn('m0','구조 그림에서 위치 보기')}</p>`;
  return `<div class="sd-h">${IMG[s.p||s.id]?`<img src="${IMG[s.p||s.id]}" alt="${s.nm} 모습">`:''}<div><span class="qn">${s.sense} · ${s.out}</span><h3>${s.nm}</h3><p>${s.role}</p></div></div>
   <h4>활용</h4><p>${s.use}</p><h4>구성</h4><ul>${s.parts.map(p=>`<li>${p}</li>`).join('')}</ul>
   <h4>핀</h4><table class="ptab"><tbody>${s.pins.map(([a,b])=>`<tr><th>${a}</th><td>${b}</td></tr>`).join('')}</tbody></table>
   <h4>동작 원리</h4><p>${s.how}</p>
   ${s.fix?`<div class="fix"><b>바로잡기 · 보충</b>${s.fix}</div>`:''}
   ${board==='mb'&&/5V/.test(s.pins.map(x=>x[1]).join(''))?`<div class="fix soft"><b>마이크로비트에 연결할 때</b>마이크로비트 핀은 3.3V예요. 5V가 꼭 필요한 센서는 확장 보드의 5V 전원을 쓰고, 출력 전압이 3.3V를 넘지 않는지 확인해요.</div>`:''}
   <p class="links">${/I²C/.test(s.out)?termBtn('i2c','용어: I²C 통신'):''} ${/아날로그/.test(s.out)?termBtn('analog','용어: 아날로그 신호'):''} ${s.theory?goBtn(s.theory,'관련 이론 학습'):''} ${s.mission?goBtn(s.mission,'이 센서를 쓰는 실습'):''}</p>
   <p class="src">${s.p?'센서 사진과 기본 설명: 수업 교재 부록 「1. 센서」를 바탕으로 정리':'그림: 핀 배치를 보여 주는 설명 그림'}</p>`;},
 act(a,el){if(a==='sen'){Snd.click();this.st.sel=el.dataset.v;const sc=$('.sens-list')?$('.sens-list').scrollTop:0;this.draw();const l=$('.sens-list');if(l)l.scrollTop=sc;}
  if(a==='sf'){this.st.f=el.dataset.v;this.draw();}}
});

const DOC_GL=board=>({id:'gl-'+board,board,doc:true,no:'G',title:'용어 사전',term:['찾아보기'],
 goal:'실습과 이론에 나오는 용어를 모았어요. 실습 화면의 용어 버튼을 누르면 이 설명이 창으로 떠요.',
 mount(){this.st={q:''};$('#sim').innerHTML=`<div class="doc"><div class="glq"><label for="glq">용어 찾기</label><input id="glq" data-act="glq" type="search" placeholder="예: 풀업, PWM, map" autocomplete="off"></div><div id="glList" class="gl-list"></div></div>`;this.list();$('#ctrl').innerHTML='';},
 focus(a){if(a){const e=document.getElementById('g-'+a);if(e){e.scrollIntoView({block:'center'});e.classList.add('hit');setTimeout(()=>e.classList.remove('hit'),1600);}}},
 list(){const q=this.st.q.trim().toLowerCase();const ks=Object.keys(GLOSS).filter(k=>!q||(GLOSS[k].t+GLOSS[k].b).toLowerCase().includes(q));
  $('#glList').innerHTML=ks.length?ks.map(k=>{const g=GLOSS[k];return `<div class="gl-it" id="g-${k}"><h4>${g.t}</h4><p>${g.b}</p>${g.go?`<p class="links">${goBtn(g.go,'관련 이론 학습')}</p>`:''}</div>`;}).join(''):'<p class="mut">찾는 용어가 없어요. 다른 낱말로 찾아보세요.</p>';},
 act(a,el){if(a==='glq'){this.st.q=el.value;this.list();}}
});

 tpl:`const int TRIG = 9;
const int ECHO = 10;
const int RED = 4;
const int YEL = 3;
const int GRN = 2;
const int BUZ = 8;

void setup() {
  pinMode(TRIG, OUTPUT);
  pinMode(ECHO, INPUT);
  pinMode(RED, OUTPUT);
  pinMode(YEL, OUTPUT);
  pinMode(GRN, OUTPUT);
  Serial.begin(9600);
}

void loop() {
  digitalWrite(TRIG, HIGH);
  delayMicroseconds(10);
  digitalWrite(TRIG, LOW);
  long t = pulseIn(ECHO, HIGH);      // 왕복 시간(μs)
  float d = t * ⟦k⟧ / 2;             // 거리(cm)
  Serial.println(d);

  digitalWrite(RED, LOW);            // 일단 모두 끄기
  digitalWrite(YEL, LOW);
  digitalWrite(GRN, LOW);

  if (d < ⟦near⟧) {
    digitalWrite(RED, HIGH);
    tone(BUZ, 1000);                 // 연속음
  } else if (d < ⟦mid⟧) {
    digitalWrite(⟦midLed⟧, HIGH);
    tone(BUZ, 1000, 100);            // 0.1초만 삑
  } else {
    digitalWrite(GRN, HIGH);
    noTone(BUZ);
  }
  delay(300);
}`,

const int LED2 = 3;
const int LED3 = 4;

void setup() {
  pinMode(LED1, OUTPUT);
  pinMode(LED2, OUTPUT);
  pinMode(LED3, OUTPUT);
  Serial.begin(9600);
}

void loop() {
  int raw = analogRead(SENSOR);          // 0 ~ 1023
  float volt = raw * ⟦vk⟧;               // 전압(V)
  float temp = (volt - ⟦off⟧) * 100;     // 섭씨(℃)
  Serial.println(temp);

  int n = 0;                             // 켤 LED 개수
  if (temp >= ⟦c1⟧) {
    n = 3;
  } else if (temp >= ⟦c2⟧) {
    n = 2;
  } else if (temp >= 20) {
    n = 1;
  }
  digitalWrite(LED1, n >= 1 ? HIGH : LOW);
  digitalWrite(LED2, n >= 2 ? HIGH : LOW);
  digitalWrite(LED3, n >= 3 ? HIGH : LOW);
  delay(500);
}`,

 tpl:`#include <Servo.h>
Servo door;
const int BTN[3] = {2, 3, 4};      // 1·2·3번 버튼
int pass[4] = {⟦p⟧};               // 비밀번호
int entered[4];                    // 누른 번호
int cnt = 0;

void setup() {
  for (int i = 0; i < 3; i++) {
    pinMode(BTN[i], ⟦mode⟧);
  }
  door.attach(9);
  door.write(0);                   // 닫힘
}

void loop() {
  for (int i = 0; i < 3; i++) {
    if (digitalRead(BTN[i]) == LOW) {   // 누르면 LOW
      entered[cnt] = i + 1;
      cnt++;
      delay(250);                       // 떨림 방지
    }
  }
  if (cnt == 4) {
    bool ok = true;
    for (int i = 0; i < 4; i++) {
      if (entered[i] ⟦cmp⟧ pass[i]) ok = false;
    }
    if (ok) {
      door.write(⟦ang⟧);              // 열기
      delay(3000);
      door.write(0);
    } else {
      tone(8, 200, 500);             // 틀림 경고음
    }
    cnt = 0;
  }
}`,

 brief:{from:'학생 작품 아이디어 · 산사태 예방 및 방지 구조물',story:'토양 습도 센서로 위험 정도를 미리 알리고, 흙 아래 압력 센서의 값이 갑자기 줄면 산사태가 시작됐다고 판단해요. 그때 DC 모터로 마을 앞 쉘터를 올리고 계속 경보를 울려요.',

 blanks:{mp:{o:['0, 100','100, 0','0, 1023'],a:0,d:2,label:'습도 % 범위'},ratio:{o:['0.7','1.0','1.3'],a:0,d:1,label:'압력 감소 기준'},w:{o:['70','85','95'],a:1,d:1,label:'경고 기준'},c:{o:['70','85'],a:0,d:0,label:'주의 기준'}},
 tpl:`#include <Wire.h>
#include <LiquidCrystal_I2C.h>
LiquidCrystal_I2C lcd(0x27, 16, 2);   // 16칸 × 2줄

const int SOIL = A0;    // 토양 습도 센서
const int PRES = A1;    // 압력 센서 (흙 무게)
const int IN1 = 6;      // 모터 드라이버
const int IN2 = 7;
const int BUZ = 8;
int basePres;           // 평소 압력
bool raised = false;    // 쉘터를 올렸나?

void setup() {
  lcd.init();
  lcd.backlight();
  pinMode(IN1, OUTPUT);
  pinMode(IN2, OUTPUT);
  basePres = analogRead(PRES);   // 처음 흙 무게 기억
}

void loop() {
  int soil = map(analogRead(SOIL), 0, 1023, ⟦mp⟧);
  int pres = analogRead(PRES);

  lcd.setCursor(0, 0);
  lcd.print("SOIL ");
  lcd.print(soil);
  lcd.print("%      ");
  lcd.setCursor(0, 1);

  if (pres < basePres * ⟦ratio⟧) {   // 흙이 쓸려 내려감
    lcd.print("!! LANDSLIDE !! ");
    tone(BUZ, 1500);
    if (!raised) {
      digitalWrite(IN1, HIGH);       // 쉘터 올리기
      digitalWrite(IN2, LOW);
      delay(2000);
      digitalWrite(IN1, LOW);        // 다 올리면 멈춤
      raised = true;
    }
  } else if (soil >= ⟦w⟧) {
    lcd.print("WARNING         ");
    tone(BUZ, 800, 200);
  } else if (soil >= ⟦c⟧) {
    lcd.print("CAUTION         ");
    noTone(BUZ);
  } else {
    lcd.print("NORMAL          ");
    noTone(BUZ);
  }
  delay(200);
}`,
 struct:[['decl',1,11],['once',13,19],['loop',21,'END']],
 keys:[
  {line:'int soil = map',t:'map(값, 원래 최소, 원래 최대, 새 최소, 새 최대)',b:'0~1023 범위를 0~100(%)으로 비례해서 바꿔요. 결과는 정수로 잘려요.'},
  {line:'basePres = analogRead',t:'기준을 처음에 기억',b:'설치 장소마다 흙 무게가 달라요. 켤 때의 값을 기준으로 두고, 그보다 얼마나 줄었는지(비율)로 판단해요.'},
  {line:'if (pres < basePres',t:'비율 기준 = 여유',b:'센서 값은 늘 조금씩 흔들려요. 기준 × 1.0이면 1만 줄어도 경보가 울려요. 0.7은 30% 이상 줄어야 반응해요.'},
  {line:'if (!raised)',t:'한 번만 실행하는 깃발',b:'loop는 계속 돌기 때문에 표시(raised)가 없으면 모터를 계속 돌리게 돼요. 한 번 올렸으면 다시 올리지 않아요.'},
  {line:'} else if (soil >= ⟦w⟧)',t:'위험한 것부터 검사',b:'산사태 → 경고(85) → 주의(70) 순서로 검사해요. 기준이 같거나 순서가 바뀌면 어떤 단계는 절대 나오지 않아요.'}],
 tests:[
  {t:'습도 50% → LCD에 “SOIL 50%”',inp:[50,100],h:'map의 새 범위를 0~100으로 해요. 0~1023이면 원래 값이 그대로 나와요.',chk:r=>Math.abs(r.soil-50)<=1},
  {t:'습도 50% → NORMAL',inp:[50,100],h:'습도 %가 맞아야 단계도 맞아요. 압력 기준도 확인해요.',chk:r=>r.st==='NORMAL'},
  {t:'습도 78% → CAUTION',inp:[78,100],h:'주의 기준 70과 경고 기준 85를 확인해요.',chk:r=>r.st==='CAUTION'},
  {t:'습도 92% → WARNING + 짧은 경고음',inp:[92,100],h:'경고는 85% 이상이에요.',chk:r=>r.st==='WARNING'&&r.buz==='short'},
  {t:'압력이 3% 흔들려도 산사태로 오인하지 않음',inp:[50,97],h:'basePres × 1.0이면 조금만 줄어도 경보가 울려요. 30% 줄었을 때만 반응하게 해요.',chk:r=>r.st!=='LANDSLIDE'},
  {t:'압력이 절반으로 → LANDSLIDE + 쉘터',inp:[50,50],h:'압력이 기준 비율보다 작아질 때 LANDSLIDE 쪽이 실행돼야 해요.',chk:r=>r.st==='LANDSLIDE'&&r.buz==='cont'}].map(t=>({...t,
   run(v){const r=MISSIONS_F.ax4(v,t.inp[0],t.inp[1]);return{ok:t.chk(r),got:`SOIL ${r.soil}% · ${r.st} · ${BUZN[r.buz]}`};},
   show(M){M.setIn(t.inp[0],t.inp[1]);}})),
 ext:{q:'WARNING이 30초 넘게 이어지면 쉘터를 미리 반쯤(1초) 올리게 해 보세요. 작품 설명에 나온 질문(“경고 단계에서 미리 올리면 안 될까?”)에 대한 하나의 답이 돼요.',h:'millis()로 WARNING이 시작된 시각을 저장하고, 지금 시각과의 차이가 30000을 넘으면 모터를 1초 돌려요.'},
 mount(){this.st={ms:50,pf:100,acc:999,r:null,raised:false,sh:0,rain:[],bz:0};this.draw();
  $('#ctrl').innerHTML=SL('pm','토양 습도',0,100,1,50,'50 %')+SL('pp','흙 무게(압력)',30,110,1,100,'100 %')+BT('slide','산사태 발생')+BT('calm','복구 · 쉘터 내리기');},
 setIn(m,p){this.st.ms=m;this.st.pf=p;this.st.acc=999;setRange('pm',m,m+' %');setRange('pp',p,p+' %');},
 draw(){$('#sim').innerHTML=`<svg viewBox="0 0 760 420" id="sv" role="img" aria-label="산사태 경보 시스템">
  <g id="rain"></g>
  <polygon points="300,250 520,86 744,40 744,250" fill="#7d6a52"/>
  <polygon id="soil" points="330,250 520,104 744,62 744,90 540,128 360,250" fill="#5e4a33"/>
  <g id="chunk"><polygon points="560,118 640,98 660,128 580,150" fill="#6b5236"/><rect x="590" y="120" width="40" height="8" fill="#c2a24b"/></g>
  <text class="t" x="600" y="168" style="font-size:10.5px">압력 센서</text>
  <g transform="translate(470 150)"><rect x="-3" y="0" width="6" height="30" fill="#b9c0c6"/><rect x="5" y="0" width="6" height="30" fill="#b9c0c6"/><rect x="-6" y="-12" width="20" height="14" fill="#2b5ea7"/></g>
  <text class="t" x="428" y="134" style="font-size:10.5px">습도 센서</text>
  <line x1="16" x2="744" y1="250" y2="250" stroke="var(--muted)" stroke-width="2"/>
  ${[40,120,190].map(x=>`<g transform="translate(${x} 196)"><polygon points="0,18 26,0 52,18" fill="#b0563e"/><rect x="6" y="18" width="40" height="36" fill="#e8dcc6"/><rect x="20" y="32" width="12" height="22" fill="#7a5238"/></g>`).join('')}
  <rect id="shelter" x="262" y="250" width="16" height="0" fill="#8a97a0"/><text class="t tm" x="270" y="270" text-anchor="middle" style="font-size:10.5px">쉘터</text>
  <rect x="16" y="282" width="400" height="126" rx="12" fill="#20312b"/>
  <rect x="32" y="298" width="368" height="94" rx="6" fill="#9cc23d" id="lcdBg"/>
  <text id="L1" x="44" y="336" style="font:600 22px var(--mono);fill:#1d2a10;white-space:pre" xml:space="preserve"></text>
  <text id="L2" x="44" y="374" style="font:600 22px var(--mono);fill:#1d2a10;white-space:pre" xml:space="preserve"></text>
  <rect x="432" y="282" width="312" height="126" rx="12" class="panelbox"/>
  <text class="t" x="448" y="308" id="r1"></text><text class="t" x="448" y="334" id="r2"></text><text class="t" x="448" y="360" id="r3"></text><text class="t tacc" x="448" y="390" id="r4"></text></svg>`;},
 act(a,el){const s=this.st;
  if(a==='pm'){s.ms=+el.value;txt('pm-o',el.value+' %');}
  if(a==='pp'){s.pf=+el.value;txt('pp-o',el.value+' %');}
  if(a==='slide'){Snd.click();this.setIn(s.ms,50);}
  if(a==='calm'){Snd.click();s.raised=false;s.sh=0;this.setIn(s.ms,100);}},
 tick(dt){const s=this.st,v=V(this);s.acc+=dt;
  if(s.acc>=200){s.acc=0;s.r=MISSIONS_F.ax4(v,s.ms,s.pf);if(s.r.st==='LANDSLIDE'&&!s.raised){s.raised=true;s.mot=2000;}}
  const r=s.r;if(!r)return;
  if(s.mot>0){s.mot-=dt;s.sh=Math.min(1,s.sh+dt/2000);}
  setAttr('shelter','height',String(Math.round(s.sh*84)));setAttr('shelter','y',String(250-Math.round(s.sh*84)));
  const slip=clamp((100-s.pf)/60,0,1);setAttr('chunk','transform',`translate(${(-slip*150).toFixed(0)} ${(slip*70).toFixed(0)})`);
  const k=s.ms/100;setAttr('soil','fill',`rgb(${Math.round(110-60*k)},${Math.round(86-50*k)},${Math.round(56-26*k)})`);
  const pad=t=>(t+' '.repeat(16)).slice(0,16);txt('L1',pad(`SOIL ${r.soil}%`));txt('L2',pad(r.st==='LANDSLIDE'?'!! LANDSLIDE !!':r.st));
  setAttr('lcdBg','fill',r.st==='LANDSLIDE'&&Math.floor(now()/300)%2?'#d6e86a':'#9cc23d');
  txt('r1',`analogRead(SOIL) = ${r.raw}  →  soil = ${r.soil}%`);txt('r2',`pres = ${r.pres} / 기준 ${r.base} × ${Vd(this)('ratio')}`);
  txt('r3',`부저: ${BUZN[r.buz]}`);txt('r4',s.mot>0?'DC 모터 회전 중 → 쉘터 올리는 중':s.raised?'쉘터 올라감 (raised = true)':'쉘터 대기');
  s.bz-=dt;if(r.buz!=='off'&&s.bz<=0){s.bz=r.buz==='cont'?220:600;Snd.beep(r.buz==='cont'?1500:800,r.buz==='cont'?.18:.1,'square',.02);}
  let h='';const n=Math.round(k*40);for(let i=0;i<n;i++){const x=(i*97+now()/3)%728+16,y=(i*53+now()/2.2)%230+10;h+=`<line x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="${(x-4).toFixed(0)}" y2="${(y+12).toFixed(0)}" stroke="#6ea6d8" stroke-width="2" opacity=".6"/>`;}
  const rn=$('#rain');if(rn)rn.innerHTML=h;},
 active(){const r=this.st.r;if(!r)return[];return[22,23,...({LANDSLIDE:[31,32,33],WARNING:[41,42,43],CAUTION:[44,45],NORMAL:[47,48]})[r.st]];}
}

/* 미션 계산(모델): 시뮬레이션과 자동 테스트가 같은 식을 써요 */
const MISSIONS_F={
 mx1(v,L){const th=+v('th'),c=v('op')==='<'?L<th:L>th;return{c,p0:c?+v('on'):0};},
 mx2t(v,chk){if(v('g')!=='SHAKE')return{ok:false,got:'흔들어도 굴러가지 않아요'};const lo=+v('lo'),hi=+v('hi'),c=new Array(8).fill(0);let mn=99,mx=-1;
  for(let i=0;i<600;i++){const n=lo+Math.floor(Math.random()*(hi-lo+1));c[n]++;mn=Math.min(mn,n);mx=Math.max(mx,n);}
  return{ok:chk({c,min:mn,max:mx}),got:`600번 굴림 → 최소 ${mn}, 최대 ${mx}`};},
 mx3(v,st,b){if(v('gs')!=='7')return'lost';st.got=(st.got||0)+1;const num=b==='A'?+v('va'):2;
  if(num===1){const inc=v('inc');st.yes+=inc==='receivedNumber'?num:+inc;}else if(num===2)st.no+=1;return num;},
 ax1(v,d){const m=d*(+v('k'))/0.034,near=+v('near'),mid=+v('mid'),led={RED:0,YEL:0,GRN:0};let buz,br;
  if(m<near){led.RED=1;buz='cont';br=0;}else if(m<mid){led[v('midLed')]=1;buz='short';br=1;}else{led.GRN=1;buz='off';br=2;}
  const on=Object.keys(led).filter(k=>led[k]).join('+');return{m,led,buz,br,on};},
 ax2(v,T){const raw=clamp(Math.round((0.5+T/100)/5*1023),0,1023),vk={'5.0 / 1023':5/1023,'1023 / 5.0':1023/5,'5.0':5}[v('vk')];
  const volt=raw*vk,temp=(volt-+v('off'))*100,c1=+v('c1'),c2=+v('c2');let n=0;
  if(temp>=c1)n=3;else if(temp>=c2)n=2;else if(temp>=20)n=1;return{raw,volt,temp,n};},
 check(v,e){const p=v('p').split(',').map(Number);while(p.length<4)p.push(0);let ok=true;
  for(let i=0;i<4;i++){if(v('cmp')==='!='?e[i]!==p[i]:e[i]===p[i])ok=false;}return{ok};},
 ax3(v,seq){if(v('mode')!=='INPUT_PULLUP')return{read:false};const ok=MISSIONS_F.check(v,seq).ok;return{read:true,opened:ok,angle:ok?+v('ang'):0,beep:!ok};},
 ax4(v,ms,pf){const raw=Math.round(ms/100*1023),[a,b]=v('mp').split(',').map(Number),soil=Math.trunc(raw*(b-a)/1023)+a,base=800,pres=Math.round(base*pf/100);
  const ls=pres<base*(+v('ratio'));const st=ls?'LANDSLIDE':soil>=+v('w')?'WARNING':soil>=+v('c')?'CAUTION':'NORMAL';
  return{raw,soil,pres,base,st,buz:ls?'cont':st==='WARNING'?'short':'off'};}
};

  wire:[['토양 센서 전원 / GND / 신호','5V / GND / A0'],['포스 센서 한쪽','5V'],['포스 센서 다른 쪽','A1, 그리고 10kΩ 거쳐 GND'],['LCD(I2C) GND / VCC / SDA / SCL','GND / 5V / A4 / A5'],['L293D 1번 EN1 · 16번 VCC1','5V'],['L293D 2번 IN1 · 7번 IN2','D6 · D7'],['L293D 3번 · 6번 OUT','DC 모터 두 단자'],['L293D 8번 VCC2','9V 배터리 +'],['L293D 4·5·12·13번','GND (배터리 − 도 함께)'],['피에조 + / −','D8 / GND']],
  run:'토양 센서 습도를 올리면 LCD가 NORMAL → CAUTION → WARNING으로 바뀌어요. 시뮬레이션 중 포스 센서의 힘을 크게 줄이면 LANDSLIDE가 뜨고, 경보음과 함께 모터가 2초 돌아 쉘터를 올려요.',
  note:'팅커캐드에는 L298N 모듈 대신 L293D 칩이 있고, I2C LCD는 LiquidCrystal_I2C 대신 Adafruit_LiquidCrystal 라이브러리를 써요. 아래 코드는 팅커캐드에 맞게 바꾼 것이에요. 팅커캐드 토양 센서는 최댓값이 1023보다 작을 수 있으니 시리얼 모니터로 값을 보고 map 범위를 맞춰요.',
  code:`#include <Adafruit_LiquidCrystal.h>
Adafruit_LiquidCrystal lcd(0);   // 팅커캐드 I2C LCD

const int SOIL = A0;    // 토양 습도 센서
const int PRES = A1;    // 포스 센서 (흙 무게)
const int IN1 = 6;      // L293D IN1
const int IN2 = 7;      // L293D IN2
const int BUZ = 8;
int basePres;           // 평소 압력
bool raised = false;    // 쉘터를 올렸나?

void setup() {
  lcd.begin(16, 2);
  lcd.setBacklight(1);
  pinMode(IN1, OUTPUT);
  pinMode(IN2, OUTPUT);
  Serial.begin(9600);
  basePres = analogRead(PRES);   // 처음 흙 무게 기억
}

void loop() {
  int soil = map(analogRead(SOIL), 0, 1023, 0, 100);
  int pres = analogRead(PRES);
  Serial.println(analogRead(SOIL));

  lcd.setCursor(0, 0);
  lcd.print("SOIL ");
  lcd.print(soil);
  lcd.print("%      ");
  lcd.setCursor(0, 1);

  if (pres < basePres * 0.7) {     // 흙이 쓸려 내려감
    lcd.print("!! LANDSLIDE !! ");
    tone(BUZ, 1500);
    if (!raised) {
      digitalWrite(IN1, HIGH);     // 쉘터 올리기
      digitalWrite(IN2, LOW);
      delay(2000);
      digitalWrite(IN1, LOW);      // 다 올리면 멈춤
      raised = true;
    }
  } else if (soil >= 85) {
    lcd.print("WARNING         ");
    tone(BUZ, 800, 200);
  } else if (soil >= 70) {
    lcd.print("CAUTION         ");
    noTone(BUZ);
  } else {
    lcd.print("NORMAL          ");
    noTone(BUZ);
  }
  delay(200);
}`}
};

/* ---------- 코드 색칠 ---------- */
const KW=new Set('void int long float bool const if else for let function true false return while def elif and not global True False in range'.split(' '));
const CST=new Set('HIGH LOW INPUT OUTPUT INPUT_PULLUP A0'.split(' '));
function hl(src){const re=/(\/\/.*$|#(?!include)\s.*$|#$)|("[^"]*")|(#include)|(<\w+\.h>)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;let out='',i=0,m;
  while((m=re.exec(src))){out+=esc(src.slice(i,m.index));const t=m[0];
   if(m[1])out+=`<span class="c-com">${esc(t)}</span>`;else if(m[2]||m[4])out+=`<span class="c-str">${esc(t)}</span>`;else if(m[3])out+=`<span class="c-kw">${t}</span>`;
   else if(m[5])out+=`<span class="c-num">${t}</span>`;
   else{const after=src.slice(re.lastIndex);if(KW.has(t))out+=`<span class="c-kw">${t}</span>`;else if(CST.has(t))out+=`<span class="c-cst">${t}</span>`;else if(/^\s*\(/.test(after))out+=`<span class="c-fn">${t}</span>`;else out+=esc(t);}
   i=re.lastIndex;}
  return out+esc(src.slice(i));}

   <div class="sb-a">${!S.showAns[M.id]&&c<n?'<button class="cb go" data-stepchk="1">이 단계 확인</button>':''}<button class="cb" data-ans="1">${S.showAns[M.id]?'내 코드로 돌아가기':'최종 정답 보기'}</button></div>
   ${msg?`<p class="sb-m ${msg.ok?'ok':'bad'}">${msg.t}</p>`:''}</div>`;}
function stepCheck(M){const c=curStep(M),st=M.steps[c];if(!st)return;const b=S.bl[M.id]||{};
  if(st.b.some(k=>b[k]==null)){S.smsg[M.id]={t:'점선 상자(?)의 값을 먼저 골라요.'};Snd.bad();}
  else if(st.b.every(k=>b[k]===M.blanks[k].a)){S.step[M.id]=c+1;Snd.ok();
   if(c+1>=M.steps.length){S.smsg[M.id]={ok:1,t:'모든 단계 통과! 이제 전체 테스트로 동작을 확인해요.'};S.mdone[M.id]=true;renderRail();renderScore();}
   else S.smsg[M.id]={ok:1,t:`${c+1}단계 통과! 다음 빈칸이 열렸어요.`};if(M.onBlank)M.onBlank();}
  else{S.smsg[M.id]={t:'아직 아니에요. 힌트: '+st.h};Snd.bad();}
  saveBl();rePanel();}
function rePanel(){const sc=$('#pbody').scrollTop;renderPanel();$('#pbody').scrollTop=sc;}
function relCard(M){return `<div class="card rel"><span class="qn">미션 해결에 필요한 이론 · 용어</span><p class="links">${(M.links||[]).map(([id,l])=>goBtn(id,l)).join('')}</p><p class="links">${(M.terms||[]).map(k=>termBtn(k)).join('')}</p></div>`;}
function renderJudge(){const M=S.cur,res=S.tres[M.id]||{},n=M.tests.length,k=Object.keys(res).length,pass=Object.values(res).filter(r=>r.ok).length,running=!!(S.run&&S.run.M===M),c=curStep(M);
  $('#pbody').innerHTML=`<div class="card brief"><span class="from">${M.brief.from}</span><h4 style="margin-top:4px">${M.title}</h4><p>${M.brief.story}</p></div>
  ${stepBar(M)}
  <ol class="steps">${M.steps.map((s,i)=>`<li class="${i<c?'done':i===c?'cur':'lock'}"><span class="bd">${i<c?'완료':i===c?'지금':'잠김'}</span><div><b>${i+1}. ${s.t}</b>${i===c&&!S.showAns[M.id]?`<p class="mut">${s.h}</p>`:''}</div></li>`).join('')}</ol>
  <div class="testbar"><button class="cb go" data-runtest="1" ${running?'disabled':''}>${running?'테스트 중…':'▶ 전체 테스트'}</button><span class="sum">${k?`통과 ${pass} / ${n}`:`테스트 ${n}개`}</span><button class="mini" data-mreset="1">처음부터</button></div>
  ${k?`<ol class="tests">${M.tests.map((t,i)=>{const r=res[i],cur=running&&S.run.i===i,cl=r?(r.ok?'pass':'fail'):cur?'run':'';
   return `<li class="tst ${cl}"><span class="bd">${r?(r.ok?'통과':'실패'):cur?'확인 중':'대기'}</span><div><b>${t.t}</b>${r?`<span class="got">${esc(r.got)}</span>`:''}${r&&!r.ok?`<p class="hint">힌트: ${t.h}</p>`:''}</div></li>`;}).join('')}</ol>`:''}
  ${relCard(M)}
  <div class="task"><span class="qn">확장 도전</span><p style="font-weight:600;margin:4px 0 6px">${M.ext.q}</p><p class="hint">힌트: ${M.ext.h}</p>
   <button class="mini" data-reveal="1" aria-expanded="${!!S.reveal}">${S.reveal?'정답 코드 접기':'미션 정답 코드(전체) 보기'}</button>
   ${S.reveal?`<div class="codebar" style="margin-top:8px"><span class="lang">${M.lang} · 정답 전체 코드</span><span class="sp"></span><button class="mini" data-copy="task">복사</button></div><div class="code" id="taskcode">${fillTpl(M,'ans').split('\n').map((t,i)=>`<div class="ln"><span class="no">${i+1}</span><span class="tx">${hl(t)||' '}</span><span></span></div>`).join('')}</div>`:''}</div>`;}
function renderBlocks(){const L=S.cur;
  $('#pbody').innerHTML=`<div class="codebar"><span class="lang">MakeCode 블록</span>${cvToggle(L)}<span class="sp"></span><button class="mini" data-copy="main">파이썬 코드 복사</button></div>
  <div class="code bks" id="code">${bkHTML(L.blocks(L))}</div><p class="tip">블록 하나가 파이썬 한 줄이에요. 실행 중인 블록은 노란 테두리로 표시돼요.</p>`;S.activeKey='';}
/* 지금 실행 중인 줄 설명 */
function nowLine(lines){const el=$('#nowline');if(!el)return;const L=S.cur;
  if(!L||L.doc||!L.view||!lines.length||(L.kind==='mission'&&!mReady(L))){if(!el.hidden)el.hidden=true;el._k='';return;}
  const key=L.id+':'+lines.join(',');if(el._k===key&&!el.hidden)return;el._k=key;
  const code=(L.kind==='mission'?fillTpl(L,'run'):L.view().code).split('\n'),v=L.view();
  const pure=s=>/^\s*(\/\/|#)/.test(s)||!s.trim();const pick=lines.find(n=>!pure(code[n-1]||'')&&/\/\/|#\s/.test(code[n-1]||''))||lines.find(n=>!pure(code[n-1]||''))||lines[0];const raw=code[pick-1]||'';
  const m=raw.match(/^(.*?)(?:\s+\/\/\s*|\s+#\s*)(.*)$/),c=(m?m[1]:raw).trim(),why=m?m[2]:((v.keys.find(k=>lines.includes(k.line))||{}).t||'');
  el.innerHTML=`<span class="nl-n">▶ ${lines.length>1?`${Math.min(...lines)}~${Math.max(...lines)}번 줄`:`${pick}번 줄`} 실행 중</span><code>${esc(c)}</code>${why?`<span class="nl-w">${esc(why)}</span>`:''}`;el.hidden=false;}
function renderQuiz(){if(S.cur.kind==='mission')return renderJudge();const L=S.cur,a=S.ans[L.id]||{},q=L.quiz;
  $('#pbody').innerHTML=q.mcq.map((m,qi)=>{const ch=a[qi];return `<div class="q"><span class="qn">문제 ${qi+1}</span><p>${m.q}</p><div class="opts">${m.o.map((o,oi)=>{let c='';if(ch!=null){if(oi===m.a&&ch===m.a)c='right';else if(oi===ch)c='wrong';}
   return `<button class="opt ${c}" data-q="${qi}" data-o="${oi}">${String.fromCharCode(9312+oi)} ${o}</button>`;}).join('')}</div>
   ${ch!=null?`<div class="why" aria-live="polite">${ch===m.a?'<b class="okc">맞았어요.</b> ':'<b class="badc">다시 생각해 봐요.</b> '}${ch===m.a?m.w:'다른 보기를 골라 보세요.'}</div>`:''}</div>`;}).join('')+
  `<div class="task"><span class="qn">최종 확인 · 코드 바꿔 보기</span><p style="font-weight:600;margin:4px 0 6px">${q.task.q}</p><p class="hint">힌트: ${q.task.h}</p>
   <button class="mini" data-reveal="1" aria-expanded="${!!S.reveal}">${S.reveal?'정답 코드 접기':'정답 코드(전체) 보기'}</button>
   ${S.reveal?`<div class="codebar" style="margin-top:8px"><span class="lang">${L.lang} · 정답 전체 코드</span><span class="sp"></span><button class="mini" data-copy="task">복사</button></div><div class="code" id="taskcode">${q.task.code.split('\n').map((t,i)=>`<div class="ln"><span class="no">${i+1}</span><span class="tx">${hl(t)||' '}</span><span></span></div>`).join('')}</div>`:''}</div>`;}
function renderPanel(){const mi=S.cur&&S.cur.kind==='mission',lab={code:mi?'코드 빈칸':'코드',key:'구조·핵심',quiz:mi?'미션 판정':'확인 학습'};$$('.tab').forEach(t=>{t.textContent=lab[t.dataset.tab];t.setAttribute('aria-selected',String(t.dataset.tab===S.tab));});
  if(S.tab==='code')renderCode();else if(S.tab==='key')renderKeys();else renderQuiz();}
function refreshCode(){if(S.tab==='code'){const sc=$('#pbody').scrollTop;renderCode();$('#pbody').scrollTop=sc;}}
function setActive(lines){const key=lines.join(',');if(key===S.activeKey)return;S.activeKey=key;
  $$('#code .on').forEach(e=>e.classList.remove('on'));let first=null;
  lines.forEach(n=>{const e=$(`#code [data-n="${n}"]`);if(e){e.classList.add('on');if(!first)first=e;}});
  if(first&&S.tab==='code'){const box=$('#pbody'),r=first.getBoundingClientRect(),b=box.getBoundingClientRect();
   if(box.scrollHeight>box.clientHeight+4&&(r.top<b.top+40||r.bottom>b.bottom-20))box.scrollTop+=r.top-b.top-b.height*.35;}}

function go(id,anchor){const L=LESSONS.find(x=>x.id===id)||LESSONS[0];closeTerm();
  if(S.cur&&S.cur.unmount)S.cur.unmount();S.cur=L;S.fl=null;S.reveal=false;S.holding=null;S.run=null;
  S.board=L.board;S.lastBy[L.board]=L.id;document.documentElement.dataset.board=L.board;$$('.boards button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.board===L.board)));
  if(L.kind==='mission'&&!S.seen[L.id]){S.seen[L.id]=1;S.tab='quiz';}else if(L.kind!=='mission'&&S.tab==='quiz'&&!L.quiz)S.tab='code';
  renderRail();renderHead(L);$('#sim').innerHTML='';$('#ctrl').innerHTML='';$('.main').classList.toggle('doc',!!L.doc);L.mount($('#sim'),$('#ctrl'));if(L.kind==='mission'&&!L.locked)$('#ctrl').insertAdjacentHTML('afterbegin',BT('runtest','▶ 미션 테스트','go'));if(!L.doc)renderPanel();renderScore();if(L.focus&&anchor!=null)L.focus(anchor);$('#sim').scrollTop=0;
  try{localStorage.setItem('pclab-last',id);}catch(e){}}

/* ---------- 입력 처리 (탭 중심) ---------- */
function onAct(e){const el=e.target.closest('[data-act]');if(!el||!S.cur||!S.cur.act)return;if(el.dataset.act==='runtest'){runTests(S.cur);return;}
  if(S.cur.kind==='mission'&&!mReady(S.cur)&&['key','ges','many','btn'].includes(el.dataset.act)){Snd.bad();const w=$('#mwait');if(w){w.classList.remove('bump');void w.offsetWidth;w.classList.add('bump');}return;}
  if(el.tagName==='INPUT'||el.tagName==='SELECT')return;S.cur.act(el.dataset.act,el,e);}
$('#sim').addEventListener('click',onAct);$('#ctrl').addEventListener('click',onAct);
['#sim','#ctrl'].forEach(sel=>{$(sel).addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.act&&S.cur.act)S.cur.act(el.dataset.act,el,e);});
  $(sel).addEventListener('change',e=>{const el=e.target;if(el.tagName==='SELECT'&&el.dataset.act&&S.cur.act)S.cur.act(el.dataset.act,el,e);});});
document.addEventListener('pointerdown',e=>{Snd.ensure();const el=e.target.closest('[data-hold]');if(el&&S.cur&&S.cur.hold){e.preventDefault();S.holding=el.dataset.hold;S.cur.hold(S.holding,true);}});
const release=()=>{if(S.holding&&S.cur&&S.cur.hold){S.cur.hold(S.holding,false);}S.holding=null;};
['pointerup','pointercancel','blur'].forEach(ev=>window.addEventListener(ev,release));
document.addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('[data-hold]');if(el&&(e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();S.holding=el.dataset.hold;S.cur.hold(S.holding,true);}});
document.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')release();});
document.addEventListener('click',e=>{const tc=e.target.closest('[data-tccopy]');if(tc){const M=LESSONS.find(x=>x.id===tc.dataset.tccopy),t=TC[M.id].code||fillTpl(M,'ans');const ok=()=>{tc.textContent='복사했어요';setTimeout(()=>tc.textContent='코드 복사',1400);};try{navigator.clipboard.writeText(t).then(ok,()=>{const r=document.createRange();r.selectNodeContents($('#code'));getSelection().removeAllRanges();getSelection().addRange(r);tc.textContent='선택했어요 · Ctrl+C';});}catch(err){}return;}
  const t=e.target.closest('[data-term]');if(t){e.preventDefault();Snd.click();openTerm(t.dataset.term);return;}
  const g=e.target.closest('[data-goto]');if(g){e.preventDefault();Snd.click();const [id,a]=g.dataset.goto.split('#');go(id,a);return;}
  if(e.target.closest('[data-close]')||e.target.closest('#dlgClose'))closeTerm();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dlg').hidden)closeTerm();});
$('#rail').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){Snd.click();go(b.dataset.go);}});
$$('.tab').forEach(t=>t.addEventListener('click',()=>{S.tab=t.dataset.tab;Snd.click();renderPanel();$('#pbody').scrollTop=0;}));
function copyText(t,btn){const done=()=>{const o=btn.textContent;btn.textContent='복사했어요';setTimeout(()=>btn.textContent=o,1400);};
  try{navigator.clipboard.writeText(t).then(done,()=>sel());}catch(e){sel();}
  function sel(){const box=btn.closest('.pbody').querySelector(btn.dataset.copy==='task'?'#taskcode':'#code');if(box){const r=document.createRange();r.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='선택했어요 · Ctrl+C';}}}
$('#pbody').addEventListener('change',e=>{const s=e.target.closest('select.blank');if(!s)return;const M=S.cur;S.bl[M.id]=S.bl[M.id]||{};if(s.value==='')delete S.bl[M.id][s.dataset.blank];else S.bl[M.id][s.dataset.blank]=+s.value;S.smsg[M.id]=null;delete S.tres[M.id];S.run=null;saveBl();Snd.click();if(M.onBlank)M.onBlank();});
$$('.boards button').forEach(b=>b.addEventListener('click',()=>{const bd=b.dataset.board;if(bd===S.board)return;Snd.click();go(S.lastBy[bd]||LESSONS.find(L=>L.board===bd).id);}));
$('#pbody').addEventListener('click',e=>{const L=S.cur;if(e.target.closest('[data-runtest]')){runTests(L);return;}
  const cv=e.target.closest('[data-cv]');if(cv){S.cv=cv.dataset.cv;Snd.click();rePanel();return;}
  if(e.target.closest('[data-stepchk]')){stepCheck(L);return;}
  if(e.target.closest('[data-ans]')){S.showAns[L.id]=!S.showAns[L.id];S.smsg[L.id]=null;Snd.click();if(L.onBlank)L.onBlank();rePanel();return;}
  if(e.target.closest('[data-mreset]')){S.bl[L.id]={};S.step[L.id]=0;S.showAns[L.id]=false;S.smsg[L.id]=null;delete S.tres[L.id];saveBl();if(L.onBlank)L.onBlank();Snd.click();rePanel();return;}
  const st=e.target.closest('[data-note]');if(st){const n=st.dataset.note,box=$('#note-'+n);S.open[L.id]=S.open[L.id]||{};S.open[L.id][n]=box.hidden;box.hidden=!box.hidden;st.setAttribute('aria-expanded',String(!box.hidden));return;}
  const j=e.target.closest('[data-jump]');if(j){const n=j.dataset.jump;S.open[L.id]=S.open[L.id]||{};S.open[L.id][n]=true;S.tab='code';renderPanel();const ln=$(`#code .ln[data-n="${n}"]`);if(ln)$('#pbody').scrollTop=ln.offsetTop-80;flash([+n],1600);return;}
  const o=e.target.closest('[data-o]');if(o){const qi=+o.dataset.q,oi=+o.dataset.o;S.ans[L.id]=S.ans[L.id]||{};S.ans[L.id][qi]=oi;
   (oi===L.quiz.mcq[qi].a?Snd.ok:Snd.bad).call(Snd);const sc=$('#pbody').scrollTop;renderQuiz();$('#pbody').scrollTop=sc;renderScore();renderRail();return;}
  if(e.target.closest('[data-reveal]')){S.reveal=!S.reveal;const sc=$('#pbody').scrollTop;renderQuiz();$('#pbody').scrollTop=sc;return;}
  const c=e.target.closest('[data-copy]');if(c){copyText(L.kind==='mission'?fillTpl(L,c.dataset.copy==='task'?'ans':'cur'):(c.dataset.copy==='task'?L.quiz.task.code:L.view().code),c);}});
function syncSound(){$('#bSfx').setAttribute('aria-pressed',String(Snd.sfx));$('#bBgm').setAttribute('aria-pressed',String(Snd.bgm));try{localStorage.setItem('pclab-sound',JSON.stringify({sfx:Snd.sfx}));}catch(e){}}
$('#bSfx').addEventListener('click',()=>{Snd.sfx=!Snd.sfx;syncSound();Snd.click();});
$('#bBgm').addEventListener('click',()=>{Snd.bgm=!Snd.bgm;Snd.bgm?Snd.startPad():Snd.stopPad();syncSound();});

/* ---------- 시작 ---------- */
let last=now();
function frame(){const t=now(),dt=Math.min(100,t-last);last=t;const L=S.cur;
  try{stepRun(dt);const mr=!(L&&L.kind==='mission'&&!L.locked)||mReady(L);const mw=$('#mwait');if(mw){mw.hidden=mr;if(!mr){const c=curStep(L);mw.textContent=`${c+1}단계 빈칸(?)을 고르면 실험대가 그 코드대로 움직여요`;}}
   if(L&&L.tick&&mr)L.tick(dt);
   const lines=!mr?[]:(S.fl&&t<S.fl.until)?S.fl.lines:(L&&L.active?L.active():[]);setActive(lines);nowLine(lines);}catch(err){console.error(err);}
  requestAnimationFrame(frame);}
syncSound();
let start='m0';try{const h=location.hash.slice(1);const ls=localStorage.getItem('pclab-last');if(LESSONS.some(x=>x.id===h))start=h;else if(ls&&LESSONS.some(x=>x.id===ls))start=ls;}catch(e){}
go(start);requestAnimationFrame(frame);
</script>

</body></html>
